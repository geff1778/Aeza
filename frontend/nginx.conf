# Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
# re-resolve the upstream, so restarting the api container (which changes its
# IP) does not leave nginx pointing at a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Basic security headers. The app is same-origin, so no CORS is needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container-level liveness probe (does not touch the backend).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API and generated docs are proxied to FastAPI. The upstream host is kept
    # in a variable so the resolver above is consulted on every request.
    location /api/ {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets are content-hashed, so they can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
